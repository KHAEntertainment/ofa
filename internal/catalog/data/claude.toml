id       = "claude"
name     = "Claude Code"
homepage = "https://claude.ai/code"

[[installs]]
method   = "native"
bin      = "claude"
paths    = ["~/.local/bin/claude"]
version  = { cmd = ["claude", "--version"] }
latest   = "self"
update   = { cmd = ["claude", "update"] }

[[installs]]
method   = "npm"
package  = "@anthropic-ai/claude-code"
bin      = "claude"
version  = { cmd = ["claude", "--version"] }
latest   = "npm"
update   = { cmd = ["npm", "install", "-g", "@anthropic-ai/claude-code@latest"] }
