name: release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual re-run for an existing tag. A failed npm publish (wrong
  # trusted-publisher permissions, a registry hiccup) should not
  # require cutting a new tag — dispatch with the tag to retry.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.2.1'
        required: true
        type: string

permissions:
  contents: write   # for gh release create

env:
  # Empty on a push trigger, so this falls through to the pushed tag.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Verify the version stamp lands before anything ships. -X is a
  # silent no-op when the symbol path is wrong or the target is a
  # const, so a broken flag would publish a binary reporting the wrong
  # version with no error anywhere in the pipeline. Builds natively
  # (the matrix targets are cross-compiled and can't be executed here).
  version:
    name: Verify version stamping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On a manual dispatch, build from the tag being re-released,
          # not from whatever branch the dispatch ran against.
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and check
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go build -ldflags="-X ofa/internal/cli.version=${VERSION}" -o ofa-check ./cmd/ofa
          reported="$(./ofa-check --version)"
          expected="ofa ${VERSION}"
          if [ "${reported}" != "${expected}" ]; then
            echo "::error::version stamp mismatch: expected '${expected}', got '${reported}'"
            exit 1
          fi
          echo "ok: ${reported}"

  binaries:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin,  arch: arm64, goarch: arm64 }
          - { os: darwin,  arch: amd64, goarch: amd64 }
          - { os: linux,   arch: arm64, goarch: arm64 }
          - { os: linux,   arch: amd64, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # Tag is like v0.2.0 — strip the leading v.
          echo "tag=${TAG}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The matrix uses `include:` with bare keys, so the context is
      # matrix.os / matrix.arch / matrix.goarch — NOT matrix.target.*.
      # Referencing matrix.target.os silently resolves to the empty
      # string, which produced four identical artifact names and one
      # unusable artifact. Assert the context is populated so a future
      # edit to the matrix fails loudly instead of silently.
      - name: Verify matrix context
        env:
          M_OS: ${{ matrix.os }}
          M_ARCH: ${{ matrix.arch }}
          M_GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -z "${M_OS}" ] || [ -z "${M_ARCH}" ] || [ -z "${M_GOARCH}" ]; then
            echo "::error::matrix context is empty (os='${M_OS}' arch='${M_ARCH}' goarch='${M_GOARCH}'). Check the matrix definition and the context paths used below."
            exit 1
          fi
          echo "building ${M_OS}-${M_ARCH} (GOARCH=${M_GOARCH})"

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          go build \
            -ldflags="-s -w -X ofa/internal/cli.version=${{ steps.ver.outputs.version }}" \
            -o "bin/ofa-${{ matrix.os }}-${{ matrix.arch }}" \
            ./cmd/ofa

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ofa-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/ofa-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # merge-multiple flattens each artifact's contents into dist/, so
      # the four binaries land as dist/ofa-<os>-<arch> (files, not
      # directories). Assert they are all there before creating the
      # release, so a naming drift fails here rather than in gh.
      - name: Verify artifact set
        run: |
          missing=0
          for f in ofa-darwin-arm64 ofa-darwin-amd64 ofa-linux-arm64 ofa-linux-amd64; do
            if [ ! -f "dist/${f}" ]; then
              echo "::error::missing expected artifact dist/${f}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::present in dist/: $(ls -1 dist 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          echo "ok: $(ls -1 dist | tr '\n' ' ')"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build notes from the merged PRs since the previous tag.
          tag="${TAG}"
          prev=$(git tag --sort=-version:refname | grep -v "^${tag}$" | head -n1)
          if [ -z "${prev}" ]; then
            notes="Initial release."
          else
            notes=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${prev}...${tag}" \
              --jq '.commits[] | "- " + .commit.messageHeadline' | head -n50)
          fi

          # Checksums for the attached binaries.
          ( cd dist && sha256sum ofa-* > checksums.txt )

          # Idempotent: a re-run for a tag that already has a release
          # refreshes the assets instead of failing, so the workflow can
          # be re-dispatched to retry only the npm publish.
          assets=(
            dist/ofa-darwin-arm64
            dist/ofa-darwin-amd64
            dist/ofa-linux-arm64
            dist/ofa-linux-amd64
            dist/checksums.txt
          )
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — refreshing assets."
            gh release edit "${tag}" --title "${tag}" --notes "${notes}"
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" \
              --title "${tag}" \
              --notes "${notes}" \
              "${assets[@]}"
          fi

  npm:
    name: Publish @khaentertainment/ofa
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # npm CLI 11.5.0 added OIDC publish support (npm/cli#8336) and
          # npm's docs require 11.5.1+ on Node 22.14.0+. Node 22 ships
          # npm 10.9.9, which is still too old: it signs the provenance
          # statement fine, then sends setup-node's placeholder token on
          # the publish PUT, and the registry answers that with a bare
          # "404 Not Found" — which reads like a missing package rather
          # than an auth failure. Node 24 ships npm 11.19.1.
          node-version: '24'
          # registry-url wires up the OIDC credential that npm publish
          # picks up in preference to any token.
          registry-url: 'https://registry.npmjs.org'
          # Never cache the package manager in a release build.
          package-manager-cache: false

      # Fail loudly rather than shipping a 404 that looks like a missing
      # package. npm's docs: trusted publishing needs npm >= 11.5.1.
      - name: Assert npm supports OIDC publish
        run: |
          have="$(npm --version)"
          major="${have%%.*}"
          rest="${have#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          patch="${patch%%-*}"   # strip any prerelease suffix
          too_old=0
          if [ "${major}" -lt 11 ]; then
            too_old=1
          elif [ "${major}" -eq 11 ]; then
            if [ "${minor}" -lt 5 ]; then
              too_old=1
            elif [ "${minor}" -eq 5 ] && [ "${patch}" -lt 1 ]; then
              too_old=1
            fi
          fi
          if [ "${too_old}" -ne 0 ]; then
            echo "::error::npm ${have} cannot authenticate a publish with OIDC (need >= 11.5.1). Bump node-version in this workflow."
            exit 1
          fi
          echo "npm ${have} supports OIDC publish"

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Take the in-repo `npm/` layout (sans platform binaries) into a
      # scratch dir, stamp the version from the tag, and drop the four
      # binaries built by the `binaries` job into platforms/<arch>/.
      - name: Lay out package + drop in platform binaries
        id: layout
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp -R npm/. "$stage/"
          node -e '
            const fs=require("fs"), p=process.argv[1];
            const j=JSON.parse(fs.readFileSync(p));
            j.version=process.argv[2];
            fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n");
          ' "$stage/package.json" "$VERSION"
          mkdir -p \
            "$stage/platforms/darwin-arm64" \
            "$stage/platforms/darwin-x64" \
            "$stage/platforms/linux-arm64" \
            "$stage/platforms/linux-x64"
          # merge-multiple flattens the artifacts into dist/ as files
          # named ofa-<os>-<arch>. The Go matrix names architectures
          # `amd64`; npm's platform key is `x64`. Rename on copy.
          cp dist/ofa-darwin-arm64 "$stage/platforms/darwin-arm64/ofa"
          cp dist/ofa-darwin-amd64 "$stage/platforms/darwin-x64/ofa"
          cp dist/ofa-linux-arm64  "$stage/platforms/linux-arm64/ofa"
          cp dist/ofa-linux-amd64  "$stage/platforms/linux-x64/ofa"
          chmod 0755 "$stage"/platforms/*/ofa
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          STAGE: ${{ steps.layout.outputs.stage }}
          PKG: '@khaentertainment/ofa'
          PKG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd "$STAGE"

          # Idempotent: if this version is already on npm, there is
          # nothing to do. (npm refuses to publish over an existing
          # version, and a re-run of the pipeline is the expected way
          # to recover from a transient publish failure.)
          if npm view "${PKG}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PKG}@${PKG_VERSION} is already published — skipping."
            exit 0
          fi

          # --provenance requires OIDC (id-token: write above). The npm
          # package must have a Trusted Publisher configured to point at
          # this workflow, otherwise publish fails with EOTP / no OIDC
          # token. Configure once at:
          #   https://www.npmjs.com/package/@khaentertainment/ofa/access
          #     → Publishing access → Trusted Publishers → GitHub Actions
          #       Organization or user: KHAEntertainment
          #       Repository: ofa
          #       Workflow filename: release.yml
          #       Allowed actions: enable BOTH "publish" and "dist-tag"
          #         (a publisher created after 2026-09-03 is granted
          #          `npm stage publish` only, and `npm publish` needs
          #          the publish + dist-tag permissions — without them
          #          the registry answers 403 "OIDC permission denied
          #          for this action").
          npm publish --access public --provenance
