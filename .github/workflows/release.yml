name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # for gh release create

jobs:
  binaries:
    name: Build ${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin,  arch: arm64, goarch: arm64 }
          - { os: darwin,  arch: amd64, goarch: amd64 }
          - { os: linux,   arch: arm64, goarch: arm64 }
          - { os: linux,   arch: amd64, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # Tag is like v0.2.0 — strip the leading v.
          echo "tag=${GITHUB_REF_NAME}"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          go build \
            -ldflags="-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "bin/ofa-${{ matrix.target.os }}-${{ matrix.target.arch }}" \
            ./cmd/ofa

      - name: Compute sha256
        id: hash
        run: |
          echo "sha256=$(sha256sum "bin/ofa-${{ matrix.target.os }}-${{ matrix.target.arch }}" | awk '{print $1}')" \
            >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ofa-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: bin/ofa-${{ matrix.target.os }}-${{ matrix.target.arch }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build notes from the merged PRs since the previous tag.
          tag="${GITHUB_REF_NAME}"
          prev=$(git tag --sort=-version:refname | grep -v "^${tag}$" | head -n1)
          if [ -z "${prev}" ]; then
            notes="Initial release."
          else
            notes=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${prev}...${tag}" \
              --jq '.commits[] | "- " + .commit.messageHeadline' | head -n50)
          fi

          gh release create "${tag}" \
            --title "${tag}" \
            --notes "${notes}" \
            dist/ofa-darwin-arm64 \
            dist/ofa-darwin-amd64 \
            dist/ofa-linux-arm64 \
            dist/ofa-linux-amd64

  npm:
    name: Publish @khaentertainment/ofa
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Adding registry-url here is what enables --provenance
          # below: setup-node wires up the OIDC credential so npm
          # publish can attest the build back to this workflow without
          # needing an NPM_TOKEN secret.
          registry-url: 'https://registry.npmjs.org'

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Take the in-repo `npm/` layout (sans platform binaries) into a
      # scratch dir, stamp the version from the tag, and drop the four
      # binaries built by the `binaries` job into platforms/<arch>/.
      - name: Lay out package + drop in platform binaries
        id: layout
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp -R npm/. "$stage/"
          node -e '
            const fs=require("fs"), p=process.argv[1];
            const j=JSON.parse(fs.readFileSync(p));
            j.version=process.argv[2];
            fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n");
          ' "$stage/package.json" "$VERSION"
          mkdir -p \
            "$stage/platforms/darwin-arm64" \
            "$stage/platforms/darwin-x64" \
            "$stage/platforms/linux-arm64" \
            "$stage/platforms/linux-x64"
          # The Go matrix names architectures `amd64`; npm's platform
          # key is `x64`. Rename on copy.
          cp dist/ofa-darwin-arm64/ofa "$stage/platforms/darwin-arm64/"
          cp dist/ofa-darwin-amd64/ofa "$stage/platforms/darwin-x64/"
          cp dist/ofa-linux-arm64/ofa  "$stage/platforms/linux-arm64/"
          cp dist/ofa-linux-amd64/ofa  "$stage/platforms/linux-x64/"
          chmod 0755 "$stage"/platforms/*/ofa
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          STAGE: ${{ steps.layout.outputs.stage }}
        run: |
          cd "$STAGE"
          # --provenance requires OIDC (id-token: write above). The
          # npm package must have a Trusted Publisher configured to
          # point at this workflow, otherwise publish fails with
          # EOTP / no OIDC token. Configure once at:
          #   https://www.npmjs.com/package/@khaentertainment/ofa/access
          #     → Publishing access → Trusted Publishers → GitHub Actions
          #       Repository: KHAEntertainment/ofa
          #       Workflow filename: release.yml
          npm publish --access public --provenance
