name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify go.mod is tidy
        run: go mod tidy -diff
        # `go mod tidy -diff` exits non-zero if go.mod/go.sum would change
        # when tidied. Catches accidental dirty commits.

      - name: go vet
        run: go vet ./...

      - name: Regenerate banner
        # The banner string is generated by scripts/gen-banner and
        # committed as a Go constant. CI regenerates it from the local
        # ascii.rest sources and confirms `git diff` is empty — that
        # catches drift between ascii.rest's source contract and our
        # generated Art string in a way `go test` alone cannot.
        run: |
          node scripts/gen-banner/generate.mjs > /tmp/art.go
          if ! diff -u internal/banner/art.go /tmp/art.go; then
            echo "::error::internal/banner/art.go is out of date. Regenerate with:"
            echo "::error::  node scripts/gen-banner/generate.mjs > internal/banner/art.go"
            exit 1
          fi

      - name: go test
        run: go test ./...
